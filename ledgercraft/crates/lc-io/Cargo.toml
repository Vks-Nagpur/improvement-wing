[package]
name = "lc-io"
version.workspace = true
edition.workspace = true
description = "LedgerCraft input readers (Excel/CSV) and output writers (Excel, HTML, JSON)"

[dependencies]
lc-core = { path = "../lc-core" }
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }
serde.workspace = true
serde_json.workspace = true
calamine = "0.26"
rust_xlsxwriter = "0.79"
csv = "1"
sha2 = "0.10"
typst = "0.15"
typst-as-lib = "0.16"
typst-pdf = "0.15"
quick-xml = "0.37"
ureq = "2"
docx-rs = "0.4.22"
zip = { version = "2", default-features = false, features = ["deflate"] }

[dev-dependencies]
lc-testdata = { path = "../lc-testdata" }
tiny_http = "0.12"
