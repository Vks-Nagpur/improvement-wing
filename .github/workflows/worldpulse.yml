name: WorldPulse data

# Collects public data on GitHub's runners, analyses it and publishes compact
# JSON. Scheduled runs are best-effort (GitHub may delay or skip them).
on:
  schedule:
    - cron: "17 */3 * * *"   # every 3 hours
  workflow_dispatch:
  push:
    paths: ["worldpulse/**", ".github/workflows/worldpulse.yml"]

concurrency:
  group: worldpulse-data
  cancel-in-progress: false

permissions:
  contents: write

env:
  DATA_BRANCH: worldpulse-data   # orphan branch holding only the latest snapshot (force-pushed, no history growth)

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: worldpulse/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: worldpulse/backend/requirements*.txt
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Unit tests (offline)
        run: python -m pytest -q tests

      - name: Restore previous database (keeps history for baselines)
        run: |
          mkdir -p ../data
          if git fetch --depth=1 origin "$DATA_BRANCH" 2>/dev/null; then
            git show "origin/$DATA_BRANCH:worldpulse.sqlite.gz" > ../data/worldpulse.sqlite.gz 2>/dev/null && gunzip -f ../data/worldpulse.sqlite.gz || echo "no previous database"
          else
            echo "first run: no data branch yet"
          fi

      - name: Collect, analyse, export
        timeout-minutes: 22
        env:
          PYTHONUNBUFFERED: "1"
          FIRMS_MAP_KEY: ${{ secrets.FIRMS_MAP_KEY }}
          WORLDPULSE_DB: ${{ github.workspace }}/worldpulse/data/worldpulse.sqlite
          WORLDPULSE_EXPORT: ${{ github.workspace }}/worldpulse/data/public
        run: python -m worldpulse run --force

      - name: Publish snapshot to the data branch
        run: |
          cd ../data
          gzip -9 -k -f worldpulse.sqlite
          rm -rf /tmp/snap && mkdir -p /tmp/snap
          cp -r public/. /tmp/snap/
          cp worldpulse.sqlite.gz /tmp/snap/
          cat > /tmp/snap/README.md <<EOF
          # WorldPulse data snapshot
          Generated by the "WorldPulse data" workflow at $(date -u +%Y-%m-%dT%H:%M:%SZ) from commit ${GITHUB_SHA}.
          Latest snapshot only — this branch is force-pushed on every run.
          EOF
          cd /tmp/snap
          git init -q -b "$DATA_BRANCH"
          git config user.name "worldpulse-bot"
          git config user.email "worldpulse-bot@users.noreply.github.com"
          git add -A
          git commit -q -m "WorldPulse data snapshot $(date -u +%Y-%m-%dT%H:%MZ) [skip ci]"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" "$DATA_BRANCH:$DATA_BRANCH"

  pages:
    # Opt in: set repository variable WORLDPULSE_PAGES=true and choose
    # Settings → Pages → Source: GitHub Actions.
    needs: collect
    if: vars.WORLDPULSE_PAGES == 'true' && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    defaults:
      run:
        working-directory: worldpulse/frontend
    steps:
      - uses: actions/checkout@v4
      - name: Fetch latest data snapshot
        run: |
          git fetch --depth=1 origin "$DATA_BRANCH"
          mkdir -p public/data
          git archive "origin/$DATA_BRANCH" | tar -x -C public/data
          rm -f public/data/worldpulse.sqlite.gz
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worldpulse/frontend/package-lock.json
      - run: npm ci
      - run: npm run build
        env:
          WORLDPULSE_BASE: /${{ github.event.repository.name }}/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: worldpulse/frontend/dist
      - id: deploy
        uses: actions/deploy-pages@v4
