[workspace]
resolver = "2"
members = ["crates/lc-core", "crates/lc-testdata", "crates/lc-io", "crates/lc-cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["std", "serde"] }

[profile.test]
opt-level = 2
