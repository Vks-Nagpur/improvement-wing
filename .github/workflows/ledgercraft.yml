name: LedgerCraft tests

on:
  push:
    paths: ["ledgercraft/**", ".github/workflows/ledgercraft.yml"]
  pull_request:
    paths: ["ledgercraft/**", ".github/workflows/ledgercraft.yml"]

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: ledgercraft
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --all
      - run: cargo run --release -p lc-cli -- bench --vouchers 200000
