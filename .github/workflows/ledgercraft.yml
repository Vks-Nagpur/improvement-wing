name: LedgerCraft

on:
  push:
    paths: ["ledgercraft/**", ".github/workflows/ledgercraft.yml"]
    tags: ["ledgercraft-v*"]
  pull_request:
    paths: ["ledgercraft/**", ".github/workflows/ledgercraft.yml"]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: ledgercraft
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --all
      - run: cargo run --release -p lc-cli -- bench --vouchers 200000

  windows-app:
    needs: test
    runs-on: windows-latest
    defaults:
      run:
        working-directory: ledgercraft
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release -p lc-app -p lc-cli
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target/release/LedgerCraft.exe dist/
          Copy-Item target/release/ledgercraft.exe dist/ledgercraft-cli.exe
          Copy-Item README.md dist/
          Copy-Item crates/lc-io/fonts/LICENSE-*.txt dist/
          New-Item -ItemType Directory -Force dist/docs | Out-Null
          Copy-Item docs/GUIDE-*.md dist/docs/
          Copy-Item README.md dist/docs/GUIDE-en.md
          Copy-Item -Recurse samples/practice dist/practice
      - name: Installer
        shell: pwsh
        run: |
          $nsis = "${env:ProgramFiles(x86)}\NSIS\makensis.exe"
          if (-not (Test-Path $nsis)) { choco install nsis -y --no-progress; }
          $ver = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          & $nsis /V2 "/DVERSION=$ver" "/DDIST=$PWD\dist" installer\ledgercraft.nsi
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Remove-Item -Recurse dist/docs, dist/practice
      - uses: actions/upload-artifact@v4
        with:
          name: LedgerCraft-windows
          path: ledgercraft/dist
      - name: Attach to release (tags only)
        if: startsWith(github.ref, 'refs/tags/ledgercraft-v')
        uses: softprops/action-gh-release@v2
        with:
          files: ledgercraft/dist/*
